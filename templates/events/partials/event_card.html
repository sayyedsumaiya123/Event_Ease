{% load humanize %}
<a href="{% url 'events:event_detail' event.slug %}" class="event-card-premium">
    <div class="event-img">
        <span class="cat-badge">{% if event.category %}{{ event.category.name }}{% else %}Event{% endif %}</span>
        {% if event.image %}
        <img src="{{ event.image.url }}" alt="{{ event.title }}">
        {% else %}
        <!-- Fallback image based on event name or random -->
        <img src="https://images.unsplash.com/photo-1505373877841-8d25f7d46678?q=80&w=600&auto=format&fit=crop" alt="Event Placeholder">
        {% endif %}
    </div>
    <div class="event-body">
        <h4 class="event-title">{{ event.title }}</h4>
        <div class="event-meta">
            <span><i class="bi bi-calendar3"></i> {{ event.date|date:"M d, Y" }} &bull; {{ event.time|time:"h:i A" }}</span>
            <span><i class="bi bi-geo-alt-fill"></i> {{ event.venue }}</span>
        </div>
        <div class="event-cta mt-auto">
            View Details <i class="bi bi-arrow-right"></i>
        </div>
    </div>
</a>
