{% extends 'base.html' %}

{% block title %}Attendance Error{% endblock %}

{% block content %}
<section class="list-header" style="padding: 60px 0; margin-bottom: 40px;">
    <div class="container text-center">
        <h1 class="list-title" style="margin-bottom: 8px;">Check-In Failed</h1>
        <p class="list-subtitle">We couldn't process your attendance</p>
    </div>
</section>

<section class="section-spacing" style="padding-top: 0; min-height: 50vh; display: flex; align-items: center; justify-content: center;">
    <div class="container d-flex justify-content-center">
        <div style="background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 48px; max-width: 500px; width: 100%; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.05);">
            
            <div style="width: 80px; height: 80px; background: rgba(214, 69, 69, 0.1); color: var(--error); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; margin: 0 auto 24px;">
                <i class="bi bi-exclamation-circle-fill"></i>
            </div>
            
            <h2 style="font-weight: 800; font-size: 2rem; color: var(--navy); margin-bottom: 16px;">Scan Error</h2>
            
            <div style="background: rgba(214, 69, 69, 0.05); border: 1px solid rgba(214, 69, 69, 0.2); border-radius: var(--radius); padding: 16px; margin-bottom: 32px;">
                <p style="color: var(--error); font-weight: 600; margin-bottom: 0; font-size: 1.1rem;">{{ message }}</p>
            </div>
            
            <a href="{% url 'events:home' %}" class="btn-brand w-100" style="padding: 16px; font-size: 1.1rem;">
                Return to Home
            </a>
        </div>
    </div>
</section>
{% endblock %}
