{% extends 'base.html' %}

{% block title %}Login — EventEase{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="auth-card">
                    <div class="auth-header">
                        <div class="auth-icon">
                            <i class="bi bi-box-arrow-in-right"></i>
                        </div>
                        <h2>Welcome Back</h2>
                        <p>Sign in to your EventEase account</p>
                    </div>
                    <form method="POST" id="loginForm">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            {{ form.username }}
                        </div>
                        <div class="mb-4">
                            <label class="form-label">Password</label>
                            {{ form.password }}
                        </div>
                        <button type="submit" class="btn btn-primary w-100 btn-lg" id="loginSubmitBtn">
                            <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
                        </button>
                    </form>
                    <div class="auth-demo-hint">
                        <small>
                            <i class="bi bi-info-circle me-1"></i>
                            Demo admin: <strong>admin</strong> / <strong>Admin@123</strong>
                        </small>
                    </div>
                    <div class="auth-footer">
                        Don't have an account?
                        <a href="{% url 'accounts:register' %}">Register Free</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
